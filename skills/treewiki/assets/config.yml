version: 5
documents:
  include:
    - "docs/chatgpt-http-development.md"
    - AGENTS.md
    - "**/AGENTS.md"
    - "docs/**/*.md"
    - ".codex/prompts/supporting/**/*.md"
    - ".knowledge/private-memory/l0/**/*.md"
  exclude:
    - "lmwiki/**/assets/AGENTS.md"
    - "treewiki/**/assets/AGENTS.md"
    - "skills/**/assets/AGENTS.md"
    - "plugins/**/skills/**/assets/AGENTS.md"
    - ".agents/**/skills/**/assets/AGENTS.md"
    - ".agents/skills/.treewiki-backups/**"
    - ".knowledge/upgrade-backups/**"
    - ".knowledge/document-backups/**"
    - ".knowledge/document-history/**"
  composition:
    body_line_target: 50
    body_line_hard_limit: 80
    body_token_hard_limit: 1000
vocabulary_path: docs/vocabulary/topics.yml
glossary_path: docs/vocabulary/glossary.yml
review_warning_days: 180
memory:
  enabled: true
  capture: explicit
  layout_version: 2
  private_path: .knowledge/private-memory
  shared_path: docs/memory
  levels: [l0, l1, l2, l3]
  persona_requires_sources: 2
  l3:
    knowledge_path: docs/memory/l3/knowledge
    persona_path: docs/memory/l3/persona
history:
  schema: 1
  storage: local
  path: .knowledge/document-history
  enforce: true
hooks:
  enabled: false
  execution: same_thread
  memory_stages: [l0, l1, l2]
  l3:
    enabled: true
    minimum_sources: 2
  runbook:
    enabled: true
    require_user_confirmation: true
    status: draft
access_control:
  default_visibility: team
  default_owner: user:owner
  default_team: team:repository
  managers: [user:owner]
  principal_required: true
  policy_enforcement: cooperative
retrieval:
  keyword_enabled: true
  graph_hops: 1
  max_results: 6
  bm25_enabled: true
  bm25_index_path: .knowledge/index/search.db
  bm25_candidate_limit: 24
  bm25_result_limit: 12
  bm25_query_mode: high_recall
  result_content: locations_only
  gap_ledger_path: .knowledge/index/retrieval-gaps.jsonl
governance:
  required: true
  standards_committee:
    managers: [user:owner]
    quorum: 1
  domain_committees:
    repository:
      managers: [user:owner]
      quorum: 1
embedding:
  enabled: false
  execution: none
  remote_content_allowed: false
  provider: null
  model: null
  index_path: .knowledge/index/
  chunk_target_tokens: 800
  chunk_max_tokens: 1000
  chunk_overlap_tokens: 120
